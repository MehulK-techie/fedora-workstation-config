name: Feature request
description: Suggest an app, extension, shortcut or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Which everyday task gets easier? Does it conflict with any existing shortcut (`mk doctor` shows conflicts)?
