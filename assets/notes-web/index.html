<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MK Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root {
  --accent: #2fa8ff; --bg: #f6f7fb; --card: #ffffff; --fg: #1d2330; --dim: #6b7487; --line: #e3e7ef;
  --danger: #ff4d6d; color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1420; --card: #171e2d; --fg: #e6ecf5; --dim: #8b96aa; --line: #263045; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 16px/1.5 -apple-system, "Inter", "Roboto", system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg);
  transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
.screen.hidden { transform: translateX(100%); pointer-events: none; }
#list.behind { transform: translateX(-25%); opacity: .6; }
header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 14px 8px; }
header h1 { font-size: 30px; margin: 0; flex: 1; font-weight: 800; letter-spacing: -.02em; }
.icon { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; font-size: 20px; }
.icon:active { background: color-mix(in srgb, var(--fg) 10%, transparent); }
.icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.accent { color: var(--accent); }
#search { margin: 0 14px 8px; padding: 10px 14px; border-radius: 12px; border: 0; outline: 0;
  background: color-mix(in srgb, var(--fg) 7%, transparent); }
#chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 10px; scrollbar-width: none; }
.chip { flex: none; padding: 6px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
#notes { flex: 1; overflow-y: auto; padding: 0 12px 120px; }
.section { font-size: 13px; font-weight: 700; color: var(--dim); margin: 14px 6px 6px; text-transform: uppercase; letter-spacing: .04em; }
.group { background: var(--card); border-radius: 14px; overflow: hidden; }
.note { display: block; width: 100%; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); position: relative; }
.note:last-child { border-bottom: 0; }
.note:active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.note b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
.note small { display: block; color: var(--dim); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note .dot { position: absolute; right: 14px; top: 16px; width: 10px; height: 10px; border-radius: 5px; }
.note .pend { position: absolute; right: 14px; bottom: 12px; font-size: 11px; color: var(--accent); }
#fab { position: fixed; right: 20px; bottom: calc(env(safe-area-inset-bottom) + 20px); width: 60px; height: 60px; border-radius: 30px;
  background: var(--accent); color: #fff; font-size: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.25); display: grid; place-items: center; }
#status { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 6px); text-align: center; font-size: 12px; color: var(--dim); pointer-events: none; }
/* editor */
#editor header { padding-bottom: 4px; }
#title { flex: 1; font-size: 22px; font-weight: 800; border: 0; outline: 0; background: none; min-width: 0; }
#meta { padding: 0 18px; font-size: 12px; color: var(--dim); }
#body { flex: 1; overflow-y: auto; position: relative; }
#text { width: 100%; min-height: 100%; border: 0; outline: 0; resize: none; background: none; padding: 10px 18px 140px; font-size: 17px; line-height: 1.55; }
#view { padding: 4px 18px 140px; display: none; }
#view.on { display: block; } #text.off { display: none; }
#view img { max-width: 100%; border-radius: 10px; }
#view a { color: var(--accent); text-decoration: none; }
#view .tag { background: color-mix(in srgb, var(--accent) 16%, transparent); padding: 1px 8px; border-radius: 10px; font-size: .9em; }
#view blockquote, #view .callout { margin: 1em 0; padding: 6px 14px; border-left: 3px solid var(--accent); border-radius: 6px;
  background: color-mix(in srgb, var(--accent) 8%, transparent); }
#view pre { background: color-mix(in srgb, var(--fg) 7%, transparent); padding: 12px; border-radius: 10px; overflow-x: auto; }
#view code { font-family: ui-monospace, monospace; font-size: .9em; }
#view mark { background: #ffe066; color: #1d2330; border-radius: 3px; }
#view li.task { list-style: none; margin-left: -1.3em; }
#view li.task input { width: 20px; height: 20px; accent-color: var(--accent); vertical-align: -4px; margin-right: 8px; }
#view li.task.done { text-decoration: line-through; opacity: .55; }
#view table { border-collapse: collapse; } #view td, #view th { border: 1px solid var(--line); padding: 4px 10px; }
#tools { display: flex; gap: 2px; justify-content: space-around; padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px);
  border-top: 1px solid var(--line); background: var(--card); }
#tools .icon { width: 44px; height: 44px; }
/* sheets */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; z-index: 10; }
.sheet.on { display: flex; }
.sheet > div { background: var(--card); width: 100%; border-radius: 18px 18px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px);
  max-height: 85%; overflow-y: auto; }
.sheet h2 { margin: 0 0 10px; font-size: 20px; }
.sheet .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.sheet input[type=text], .sheet input[type=url] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); margin: 6px 0 12px; }
.btn { background: var(--accent); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; width: 100%; }
.swatches { display: flex; gap: 12px; padding: 10px 0; }
.swatch { width: 34px; height: 34px; border-radius: 17px; border: 2px solid var(--line); }
/* drawing */
#draw { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; background: var(--bg); }
#draw.on { display: flex; }
#draw canvas { flex: 1; touch-action: none; width: 100%; }
#drawbar { display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 8px) 10px 8px; overflow-x: auto; }
#drawbar .swatch { width: 28px; height: 28px; flex: none; }
#drawbar .swatch.on { outline: 3px solid var(--accent); outline-offset: 1px; }
.tool.on { background: color-mix(in srgb, var(--accent) 22%, transparent); }
#toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 10px 16px;
  border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
#toast.on { opacity: .95; }
</style>
</head>
<body>

<!-- note list -->
<section id="list" class="screen">
  <header>
    <h1>Notes</h1>
    <button class="icon accent" id="syncBtn" title="Sync now"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2M18 2v4h-4M6 22v-4h4"/></svg></button>
    <button class="icon accent" id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <input id="search" type="search" placeholder="Search">
  <div id="chips"></div>
  <div id="notes"></div>
  <button id="fab" title="New note">+</button>
  <div id="status"></div>
</section>

<!-- note editor -->
<section id="editor" class="screen hidden">
  <header>
    <button class="icon accent" id="backBtn" title="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <input id="title" placeholder="Title" autocomplete="off">
    <button class="icon accent" id="modeBtn" title="Read / edit"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="icon accent" id="moreBtn" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
  </header>
  <div id="meta"></div>
  <div id="body"><textarea id="text" placeholder="Start writing…" spellcheck="true"></textarea><div id="view"></div></div>
  <div id="tools">
    <button class="icon" data-act="check" title="Checklist"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
    <button class="icon" data-act="bold" title="Bold"><b>B</b></button>
    <button class="icon" data-act="heading" title="Heading"><b>H</b></button>
    <button class="icon" data-act="list" title="List"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button class="icon" data-act="link" title="Link a note"><b style="font-size:15px;white-space:nowrap">[[ ]]</b></button>
    <button class="icon" data-act="photo" title="Photo or screenshot"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    <button class="icon" data-act="draw" title="Draw"><svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg></button>
  </div>
  <input type="file" id="photoInput" accept="image/*" hidden>
</section>

<!-- drawing -->
<div id="draw">
  <div id="drawbar">
    <button class="icon accent" id="drawCancel" title="Cancel"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <button class="icon tool on" data-tool="pen" title="Pen"><svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></button>
    <button class="icon tool" data-tool="highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
    <button class="icon tool" data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M20 20H7L3 16l10-10 7 7-3.5 3.5"/></svg></button>
    <button class="icon" id="drawUndo" title="Undo"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
    <span id="inks"></span>
    <button class="btn" id="drawDone" style="width:auto;margin-left:auto">Insert</button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<!-- sheets -->
<div class="sheet" id="settings"><div>
  <h2>Connect to your laptop</h2>
  <p style="color:var(--dim);margin-top:0">On the laptop: MK Notes › menu › Phone. Scan its code with the camera, or paste its link here.</p>
  <input type="url" id="pairLink" placeholder="http://192.168.x.x:8765/#key=…">
  <button class="btn" id="pairBtn">Connect</button>
  <p id="pairState" style="color:var(--dim)"></p>
  <button class="row" id="forgetBtn" style="color:var(--danger)">Disconnect this phone (keeps notes on it)</button>
</div></div>
<div class="sheet" id="more"><div>
  <button class="row" data-more="pin">📌 <span>Pin</span></button>
  <div class="swatches" id="colorRow"></div>
  <button class="row" data-more="share">📤 Share or save as PDF</button>
  <button class="row" data-more="move">📁 Move to folder…</button>
  <button class="row" data-more="delete" style="color:var(--danger)">🗑 Delete</button>
</div></div>
<div class="sheet" id="picker"><div><h2 id="pickerTitle"></h2><input type="text" id="pickerInput"><div id="pickerList"></div></div></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
