# App Nap (mk-indicator): when memory or the processor is under pressure, apps
# you haven't used for a while are paused (their systemd scope is frozen: no
# CPU, and their memory can be swapped to zram). Clicking one, or switching
# to it, wakes it instantly. Your own values go in
# ~/.config/mk-workstation/appnap.conf; `mk nap` shows what's napping.
APP_NAP=on
# Pressure: memory in use above this percentage...
MEM_THRESHOLD=85
# ...or the processor busier than this percentage for a whole minute
CPU_THRESHOLD=90
# Only apps unused for at least this many minutes, and only while their
# windows are minimized or on another desktop
IDLE_MINUTES=5
# Never paused (app ids or parts of them, comma-separated): terminals and
# editors (builds keep running), browsers (downloads, calls, music in tabs),
# chat apps (so messages still arrive). Apps playing sound are never paused.
NEVER=ptyxis,terminal,kgx,code,vscod,firefox,chrom,brave,zen,vivaldi,opera,edge,discord,slack,telegram,whatsapp,signal,teams,zoom,thunderbird,evolution,geary,mk-,MkNotes,MkCompanion,MkTimer
