# Dock magnification (mk-indicator). Your own values go in
# ~/.config/mk-workstation/dock.conf; log out and back in after changing.
# MAGNIFY: size of the icon under the pointer (1 = off, up to 2)
MAGNIFY=1.4
# MAGNIFY_SPREAD: how many neighbours on each side grow along with it
MAGNIFY_SPREAD=2
# MAGNIFY_MS: animation length in milliseconds
MAGNIFY_MS=160
