# Visual effects that cost the most GPU and battery. `mk effects lite` (or
# `auto` on a weak machine) keeps these extensions installed but switched off;
# `mk effects full` turns them back on. Space-separated extension UUIDs.
HEAVY=blur-my-shell@aunetx burn-my-windows@schneegans.github.com compiz-alike-magic-lamp-effect@hermes83.github.com compiz-windows-effect@hermes83.github.com

# `auto` picks lite when the machine has less than this much RAM (GiB), two
# CPU cores or fewer, or no GPU rendering (software graphics, e.g. some VMs).
AUTO_LITE_BELOW_GB=4
