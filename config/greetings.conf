# Greetings the welcome light picks from (VARIETY=on in welcome.conf).
# Add your own in ~/.config/mk-workstation/greetings.conf, same format: your
# lines join these. {title} is sir, ma'am, your name or nothing (TITLE= in
# welcome.conf); {name} is your first name. Your own GREETING= line is always
# in the mix too. The last few greetings are never repeated.

[morning]
Good morning, {title}. Systems are warm, coffee is your department.
Morning, {title}. Everything's where you left it.
Rise and shine, {title}. The desktop is ready, the day is yours.
Good morning, {title}. Shall we make today count?
Morning, {title}. All systems nominal.

[afternoon]
Good afternoon, {title}. Back to it?
Afternoon, {title}. Your workspace kept your seat warm.
Good afternoon, {title}. Everything is exactly as you left it.
Welcome back, {title}. The afternoon shift begins.

[evening]
Good evening, {title}. Let's wrap the day up nicely.
Evening, {title}. Lights on, distractions off.
Good evening, {title}. One more thing before dinner?
Welcome back, {title}. The evening is young.

[night]
Burning the midnight oil, {title}?
Working late, {title}. I'll keep the lights low.
Still up, {title}? Let's make it quick and get some sleep.
The night shift, {title}. Quiet hours, best ideas.

[monday]
A fresh week, {title}. Let's start strong.
Monday, {title}. Deep breath, first task.

[friday]
It's Friday, {title}. Finish line in sight.
Friday, {title}. Let's land the week.

[weekend]
Weekend mode, {title}. No pressure.
Working on the weekend, {title}? I admire the dedication.

[return]
Back again, {title}. Round two.
Welcome back, {title}. Picking up where we left off.
Couldn't stay away, {title}?

[long]
Long time no see, {title}. Welcome back.
There you are, {title}. It's been a few days.

[birthday]
Happy birthday, {title}! Everything's ready, take it easy today.
Happy birthday, {name}. Another year, another level.

[newyear]
Happy New Year, {title}. Fresh start, clean desktop.

[any]
Welcome back home, {title}.
At your service, {title}.
Good to see you, {title}.
Everything's ready, {title}. Where shall we begin?
Hello again, {title}. Let's build something.
All systems online, {title}. Welcome back.
