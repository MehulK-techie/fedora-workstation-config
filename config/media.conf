# Media tile in the top bar (mk-indicator), for Spotify and any MPRIS player.
# Your own values go in ~/.config/mk-workstation/media.conf (log in again to apply).
# off removes the tile completely
MEDIA=on
# The song title next to the record (cut short with "…", never scrolling)
TICKER=on
# all: any player (Spotify, browsers, video apps); spotify: Spotify only.
# Browsers only show after playing the same thing for 4 s, so YouTube's
# hover previews never take over the tile.
PLAYERS=all
# A small pill under the top bar (art, title, artist) when the song changes
TRACK_PILL=on
