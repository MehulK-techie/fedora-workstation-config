# System monitor in the top bar (mk-indicator). Your own values go in
# ~/.config/mk-workstation/monitor.conf (read live, no restart).
# What the top bar shows, in order: cpu (with a sparkline), mem, temp (°C),
# net, disk (read+write activity), power
PANEL=cpu,temp
# MK Pulse: a small pill, "12% · 46°C", tinted by health: green under 40% CPU
# and 55°C, amber to 75, crimson above (the worse of the two). Click it for
# every core, memory, temperatures, power mode and the busiest apps.
# COMPACT=yes: just the dot, opening on hover. COMPACT=no: PANEL's numbers.
COMPACT=pulse
# Seconds between readings (1 while its menu is open)
INTERVAL=2
