# MK Notes (mk-notes). Your own values go in ~/.config/mk-workstation/notes.conf.
# The vault: a folder of Markdown notes (Obsidian can open the same folder)
NOTES_DIR=~/Notes
# Phone sync: on runs it while MK Notes is open (also the switch in menu › Phone)
SYNC=off
SYNC_PORT=8765
# Keep earlier versions of each note (.mknotes/history, one every 5 minutes)
HISTORY=on
# Look (also MK Notes › menu › Preferences): THEME system|light|dark,
# FONT sans|serif|mono, FONT_SIZE px, WIDTH narrow|medium|wide|full,
# SPACING compact|comfortable|airy
THEME=system
FONT=sans
FONT_SIZE=16
WIDTH=medium
SPACING=comfortable
# FORMAT_BAR on|off, OPEN_IN edit|split|read, SORT edited|title|folder
FORMAT_BAR=on
OPEN_IN=edit
SORT=edited
