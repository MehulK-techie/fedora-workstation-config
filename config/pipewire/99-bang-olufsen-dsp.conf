# MK Workstation: B&O-style tuning for the laptop's own speakers (a PipeWire filter-chain,
# no extra software). scripts/setup-audio.sh installs it in
# ~/.config/pipewire/pipewire.conf.d/, with __SPEAKER__ replaced by the built-in speaker's
# sink (alsa_output....Speaker__sink), and only when the laptop has one.
#
# It's a WirePlumber "smart filter": it sits in front of the speaker on its own. Apps, the
# default output, GNOME's volume slider and the volume keys all stay on the speaker itself;
# headphones, HDMI and Bluetooth (other sinks) are never touched.
#
# Per channel, in this order:
#   headroom   -4 dB, so the boosts below don't push loud music into the ceiling
#   95 Hz      low shelf  +5.0 dB, Q 0.8   warmth and bass body without chassis rattle
#   140 Hz     peak       +2.5 dB, Q 1.0   punch
#   380 Hz     peak       -1.8 dB, Q 1.2   takes out the boxy, hollow resonance
#   2.8 kHz    peak       +3.2 dB, Q 1.0   voices forward
#   4.2 kHz    peak       +2.0 dB, Q 1.0   consonants, clarity
#   10.5 kHz   high shelf +3.5 dB, Q 0.7   air
# then stereo widening to 125 % (mid/side: each side = 1.125 x itself - 0.125 x the other),
# then a ceiling at -0.5 dBFS (0.944). The ceiling is a hard clamp, not a lookahead limiter:
# PipeWire's built-in nodes have none, and no limiter plugin is installed. With the 4 dB of
# headroom it only catches the rare peak at full volume.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Speaker (B&O tuning)"
      media.name       = "Speaker (B&O tuning)"
      filter.graph = {
        nodes = [
          { type = builtin name = preL  label = linear      control = { "Mult" = 0.631 } }
          { type = builtin name = preR  label = linear      control = { "Mult" = 0.631 } }
          { type = builtin name = ls95L label = bq_lowshelf control = { "Freq" = 95.0 "Q" = 0.8 "Gain" = 5.0 } }
          { type = builtin name = ls95R label = bq_lowshelf control = { "Freq" = 95.0 "Q" = 0.8 "Gain" = 5.0 } }
          { type = builtin name = pk140L label = bq_peaking control = { "Freq" = 140.0 "Q" = 1.0 "Gain" = 2.5 } }
          { type = builtin name = pk140R label = bq_peaking control = { "Freq" = 140.0 "Q" = 1.0 "Gain" = 2.5 } }
          { type = builtin name = pk380L label = bq_peaking control = { "Freq" = 380.0 "Q" = 1.2 "Gain" = -1.8 } }
          { type = builtin name = pk380R label = bq_peaking control = { "Freq" = 380.0 "Q" = 1.2 "Gain" = -1.8 } }
          { type = builtin name = pk2800L label = bq_peaking control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = 3.2 } }
          { type = builtin name = pk2800R label = bq_peaking control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = 3.2 } }
          { type = builtin name = pk4200L label = bq_peaking control = { "Freq" = 4200.0 "Q" = 1.0 "Gain" = 2.0 } }
          { type = builtin name = pk4200R label = bq_peaking control = { "Freq" = 4200.0 "Q" = 1.0 "Gain" = 2.0 } }
          { type = builtin name = hs10kL label = bq_highshelf control = { "Freq" = 10500.0 "Q" = 0.7 "Gain" = 3.5 } }
          { type = builtin name = hs10kR label = bq_highshelf control = { "Freq" = 10500.0 "Q" = 0.7 "Gain" = 3.5 } }
          # widening: the other side's share, negative (a mixer adds; a linear node scales)
          { type = builtin name = crossL label = linear     control = { "Mult" = -0.125 } }
          { type = builtin name = crossR label = linear     control = { "Mult" = -0.125 } }
          { type = builtin name = wideL label = mixer       control = { "Gain 1" = 1.125 "Gain 2" = 1.0 } }
          { type = builtin name = wideR label = mixer       control = { "Gain 1" = 1.125 "Gain 2" = 1.0 } }
          { type = builtin name = ceilL label = clamp       control = { "Min" = -0.944 "Max" = 0.944 } }
          { type = builtin name = ceilR label = clamp       control = { "Min" = -0.944 "Max" = 0.944 } }
        ]
        links = [
          { output = "preL:Out"    input = "ls95L:In" }
          { output = "ls95L:Out"   input = "pk140L:In" }
          { output = "pk140L:Out"  input = "pk380L:In" }
          { output = "pk380L:Out"  input = "pk2800L:In" }
          { output = "pk2800L:Out" input = "pk4200L:In" }
          { output = "pk4200L:Out" input = "hs10kL:In" }
          { output = "preR:Out"    input = "ls95R:In" }
          { output = "ls95R:Out"   input = "pk140R:In" }
          { output = "pk140R:Out"  input = "pk380R:In" }
          { output = "pk380R:Out"  input = "pk2800R:In" }
          { output = "pk2800R:Out" input = "pk4200R:In" }
          { output = "pk4200R:Out" input = "hs10kR:In" }
          { output = "hs10kL:Out"  input = "wideL:In 1" }
          { output = "hs10kL:Out"  input = "crossR:In" }
          { output = "hs10kR:Out"  input = "wideR:In 1" }
          { output = "hs10kR:Out"  input = "crossL:In" }
          { output = "crossL:Out"  input = "wideL:In 2" }
          { output = "crossR:Out"  input = "wideR:In 2" }
          { output = "wideL:Out"   input = "ceilL:In" }
          { output = "wideR:Out"   input = "ceilR:In" }
        ]
        inputs  = [ "preL:In" "preR:In" ]
        outputs = [ "ceilL:Out" "ceilR:Out" ]
      }
      capture.props = {
        node.name      = "mk_bang_olufsen_in"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        filter.smart        = true
        filter.smart.name   = "mk-bang-olufsen"
        filter.smart.target = { node.name = "__SPEAKER__" }
      }
      playback.props = {
        node.name      = "mk_bang_olufsen_out"
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
        stream.dont-remix = true
      }
    }
  }
]
