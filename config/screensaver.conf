# Screensaver (mk-screensaver). Your own values go in
# ~/.config/mk-workstation/screensaver.conf; also `mk screensaver`.
# on: a scene plays after DELAY seconds without input (GNOME still blanks and
# locks at its own time, set in Settings > Power and Privacy)
SCREENSAVER=on
DELAY=180
# random, aurora, web (Web Hang), knight (Night Watch), matrix (Terminal Stream)
SCENE=random
# The scene behind the lock screen's clock too; Space, a click or a swipe
# slides it up to the password and fingerprint prompt
LOCKSCREEN=on
# Web Hang's neon sign on the skyscraper: up to six letters or digits
SIGN_TEXT=MK
