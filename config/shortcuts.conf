# Every keyboard shortcut MK Workstation sets, in one place.
# sync.sh applies this file; the Shortcuts window (Super+/) shows it, live.
#
#   group | label | target | keys
#
# target is one of:
#   <gsettings schema> <key>          a GNOME shortcut (key1|key2: first that exists)
#   ext:<extension uuid> <schema> <key>   a shortcut owned by an extension
#   custom:<id> <command>             runs a command; ~ is your home folder,
#                                     @terminal and @browser pick yours
# keys: GTK accelerators separated by commas, e.g. <Super><Shift>s, Print.
#       Empty means "no key" (frees it for something else).
# group "-" applies the line but hides it from the Shortcuts window.
#
# Your own changes don't go here: the Shortcuts window (or editing
# ~/.config/mk-workstation/shortcuts.conf, same format) keeps them, and
# `mk sync` applies them on top of this file.

Windows | Switch windows (all workspaces) | org.gnome.desktop.wm.keybindings switch-windows | <Alt>Tab
- | Switch windows backward | org.gnome.desktop.wm.keybindings switch-windows-backward | <Shift><Alt>Tab
Windows | Switch apps | org.gnome.desktop.wm.keybindings switch-applications | <Super>Tab
- | Switch apps backward | org.gnome.desktop.wm.keybindings switch-applications-backward | <Shift><Super>Tab
Windows | Switch windows of this app | org.gnome.desktop.wm.keybindings switch-group | <Alt>Above_Tab, <Super>Above_Tab
- | Switch windows of this app backward | org.gnome.desktop.wm.keybindings switch-group-backward | <Shift><Alt>Above_Tab, <Shift><Super>Above_Tab
Windows | Close window | org.gnome.desktop.wm.keybindings close | <Super>q, <Alt>F4
Windows | Snap left half | ext:tiling-assistant@leleat-on-github org.gnome.shell.extensions.tiling-assistant tile-left-half | <Super>Left, <Super>KP_4
Windows | Snap right half | ext:tiling-assistant@leleat-on-github org.gnome.shell.extensions.tiling-assistant tile-right-half | <Super>Right, <Super>KP_6
Windows | Maximize | ext:tiling-assistant@leleat-on-github org.gnome.shell.extensions.tiling-assistant tile-maximize | <Super>Up, <Super>KP_5
Windows | Restore | ext:tiling-assistant@leleat-on-github org.gnome.shell.extensions.tiling-assistant restore-window | <Super>Down
Windows | Snap layouts | ext:tiling-assistant@leleat-on-github org.gnome.shell.extensions.tiling-assistant search-popup-layout | <Super>z
Windows | Center window | ext:tiling-assistant@leleat-on-github org.gnome.shell.extensions.tiling-assistant center-window | <Super><Control>c
Windows | Always on top | org.gnome.desktop.wm.keybindings toggle-above | <Super><Control>t
Windows | Full screen | org.gnome.desktop.wm.keybindings toggle-fullscreen | <Super><Control>f
Windows | Show desktop | org.gnome.desktop.wm.keybindings show-desktop | <Super>d

Workspaces | Previous workspace | org.gnome.desktop.wm.keybindings switch-to-workspace-left | <Super>Page_Up, <Super><Alt>Left, <Super><Control>Left
Workspaces | Next workspace | org.gnome.desktop.wm.keybindings switch-to-workspace-right | <Super>Page_Down, <Super><Alt>Right, <Super><Control>Right
Workspaces | New desktop | org.gnome.desktop.wm.keybindings switch-to-workspace-last | <Super>End, <Super><Control>d
Workspaces | Move window left | org.gnome.desktop.wm.keybindings move-to-workspace-left | <Super><Shift>Page_Up, <Super><Shift><Alt>Left
Workspaces | Move window right | org.gnome.desktop.wm.keybindings move-to-workspace-right | <Super><Shift>Page_Down, <Super><Shift><Alt>Right
Workspaces | Move window to a new desktop | org.gnome.desktop.wm.keybindings move-to-workspace-last | <Super><Shift>End, <Super><Control><Shift>d
Workspaces | Go to workspace 1 | org.gnome.desktop.wm.keybindings switch-to-workspace-1 | <Super><Alt>1
Workspaces | Go to workspace 2 | org.gnome.desktop.wm.keybindings switch-to-workspace-2 | <Super><Alt>2
Workspaces | Go to workspace 3 | org.gnome.desktop.wm.keybindings switch-to-workspace-3 | <Super><Alt>3
Workspaces | Go to workspace 4 | org.gnome.desktop.wm.keybindings switch-to-workspace-4 | <Super><Alt>4
Workspaces | Move window to workspace 1 | org.gnome.desktop.wm.keybindings move-to-workspace-1 | <Super><Shift><Alt>1
Workspaces | Move window to workspace 2 | org.gnome.desktop.wm.keybindings move-to-workspace-2 | <Super><Shift><Alt>2
Workspaces | Move window to workspace 3 | org.gnome.desktop.wm.keybindings move-to-workspace-3 | <Super><Shift><Alt>3
Workspaces | Move window to workspace 4 | org.gnome.desktop.wm.keybindings move-to-workspace-4 | <Super><Shift><Alt>4
- | Workspace up (unused) | org.gnome.desktop.wm.keybindings switch-to-workspace-up |
- | Workspace down (unused) | org.gnome.desktop.wm.keybindings switch-to-workspace-down |

Screenshots | Full screen, instantly | org.gnome.shell.keybindings screenshot | Print, <Super><Shift>3
Screenshots | Current window | org.gnome.shell.keybindings screenshot-window | <Alt>Print
Screenshots | Pick an area or window | org.gnome.shell.keybindings show-screenshot-ui | <Shift>Print, <Super><Shift>s, <Super><Shift>4
Screenshots | Copy text from screen (OCR) | custom:ocr ~/.local/bin/ocr-snip | <Super><Shift>t
Screenshots | Copy text (Text Extractor) | ext:text-extractor@imshaaz21.github.com org.gnome.shell.extensions.text-extractor extract-shortcut | <Super><Alt>t

System | Search / overview | org.gnome.shell.keybindings toggle-overview | <Super>s
System | App grid | org.gnome.shell.keybindings toggle-application-view | <Super>a
System | Quick settings | org.gnome.shell.keybindings toggle-quick-settings | <Super><Shift>a
System | Notifications | org.gnome.shell.keybindings toggle-message-tray | <Super>m
- | Focus notification (frees Super+N) | org.gnome.shell.keybindings focus-active-notification |
System | Clipboard history | ext:clipboard-indicator@tudmotu.com org.gnome.shell.extensions.clipboard-indicator toggle-menu | <Super>v
System | Run a command | org.gnome.desktop.wm.keybindings panel-run-dialog | <Alt>F2, <Super>r
System | Files | org.gnome.settings-daemon.plugins.media-keys home | <Super>e
System | Settings | org.gnome.settings-daemon.plugins.media-keys control-center | <Super>i
System | Shut down / restart | org.gnome.settings-daemon.plugins.media-keys shutdown|power-off | <Super>BackSpace, <Super><Shift>x
System | Shut down (asks first) | custom:poweroff gnome-session-quit --power-off | <Control><Alt>End
System | Restart (asks first) | custom:reboot gnome-session-quit --reboot | <Control><Alt>Home
System | Sleep | custom:sleep systemctl suspend | <Control><Alt>Page_Down
System | System Monitor | custom:taskmgr gnome-system-monitor | <Control><Shift>Escape

Apps | Shortcuts (this window) | custom:hud ~/.local/bin/show-shortcuts | <Super>slash
Apps | Companion: notes, tasks, timer | custom:notes ~/.local/bin/mk-companion | <Super><Shift>n
Apps | Focus timer | custom:timer ~/.local/bin/mk-timer |
Apps | Terminal | custom:terminal @terminal | <Control><Alt>t
Apps | Web browser | custom:browser @browser | <Super>b
Apps | MK Notes | custom:mknotes ~/.local/bin/mk-notes | <Super>n
Apps | MK Notes: today's note | custom:mknotes-today ~/.local/bin/mk-notes --daily | <Super><Alt>n
Apps | MK Notes: quick note | custom:mknotes-quick ~/.local/bin/mk-notes --quick | <Super><Control>n
Apps | Emoji board | custom:emoji gnome-characters | <Super>period
Apps | Camera controls | custom:camera ~/.local/bin/camera-controls | <Super>c
