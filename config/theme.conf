# Accent colour (mk-indicator). Your own values go in
# ~/.config/mk-workstation/theme.conf; also `mk accent`.
# auto: the most vivid colour of your wallpaper, updated when it changes.
# Or a fixed colour like #00c8ff.
ACCENT=auto
# Also set GNOME's accent (Files, Settings, GTK apps) to the nearest match
SYSTEM_ACCENT=on
# Mouse pointer theme (sync.sh installs Bibata-Modern-Classic); Adwaita is GNOME's
CURSOR=Bibata-Modern-Classic
