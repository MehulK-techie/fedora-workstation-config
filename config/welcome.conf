# Welcome light (mk-indicator): a neon line around the screen edges and a
# greeting after you log in. Your own values go in
# ~/.config/mk-workstation/welcome.conf; also `mk welcome` and the
# "Welcome light" switch in Quick Settings.
WELCOME=on
# {title} becomes TITLE below; {name} is your first name
GREETING=Welcome back home, {title}.
# sir, maam, name (your first name) or none
TITLE=sir
# Date and time under the greeting
SUBTITLE=on
# With the spoken greeting: "You have 2 tasks scheduled for today." (Companion
# tasks that are pinned or due today)
BRIEFING=on
# The top-bar pill with today's task count (right-click it to hide)
TASK_BADGE=on
# Speak the greeting in a calm British voice (natural voice: mk welcome voice install)
VOICE=off
# Flash the edge light for notifications too (not while Do Not Disturb is on)
EDGE_NOTIFY=off
# Gradient colours of the line: auto (from your wallpaper, see `mk accent`) or #rrggbb
COLOR_A=auto
COLOR_B=auto
# Under the greeting: pinned Companion tasks, the next reminder today and a
# low-battery hint; pinned tasks also get a notification with an Open button
TASKS=on
# A different greeting each time: by time of day, day of the week, your
# birthday, the first start of a new day, starting again the same day, or
# after days away (config/greetings.conf,
# add your own lines with `mk welcome lines`). off = always GREETING above.
VARIETY=on
# Your birthday as MM-DD or YYYY-MM-DD for a special greeting on the day
# (mk welcome birthday 07-14). The year is never used.
BIRTHDAY=
# With BIRTHDAY set: "3 months and 12 days until your birthday" under the
# first greeting of each day
BIRTHDAY_COUNTDOWN=on
