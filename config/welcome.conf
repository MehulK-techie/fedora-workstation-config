# Welcome light (mk-indicator): a neon line around the screen edges and a
# greeting after you log in. Your own values go in
# ~/.config/mk-workstation/welcome.conf; also `mk welcome` and the
# "Welcome light" switch in Quick Settings.
WELCOME=on
# {name} is replaced with your first name
GREETING=Welcome back home, sir.
# Date and time under the greeting
SUBTITLE=on
# Speak the greeting (spd-say)
VOICE=off
# Flash the edge light for notifications too (not while Do Not Disturb is on)
EDGE_NOTIFY=off
# Gradient colours of the line
COLOR_A=#00c8ff
COLOR_B=#7c4dff
