# MK Workstation: every app plays on the current default output (speakers,
# headphones, whatever is chosen in Settings), never on one WirePlumber
# remembered for it. Saved targets had pinned Spotify, Firefox and others to
# Easy Effects' virtual sink, and when Easy Effects passed nothing on, those
# apps went silent while system sounds (no saved target) still played.
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by sync.sh.
wireplumber.settings = {
  node.stream.restore-target = false
}
