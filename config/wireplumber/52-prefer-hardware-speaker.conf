# MK Workstation: the laptop's own output wins at every boot (scripts/setup-audio.sh
# installs this in ~/.config/wireplumber/wireplumber.conf.d/).
#
# WirePlumber picks the default output by priority.session. Built-in ALSA outputs
# (the speaker, headphone jack) go to 2000; HDMI / DisplayPort outputs stay lower,
# so a monitor's speakers never take over by themselves. Virtual outputs made by
# apps (Easy Effects' easyeffects_sink) aren't WirePlumber's devices, so rules
# can't change them; they already sit at 0, far below. Bluetooth headphones you
# pick yourself are still remembered (51-mk-follow-default.conf).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_output.*(hdmi|HDMI|DisplayPort).*" } ]
    actions = { update-props = { priority.session = 900, priority.driver = 900 } }
  }
]
